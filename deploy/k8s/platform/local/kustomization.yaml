# Cluster-wide gateway plumbing for kind, applied once by scripts/k8s-local-up.sh after Envoy Gateway is installed.
# The Envoy Service is a NodePort on 30080, which kind maps to http://localhost:8090.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
