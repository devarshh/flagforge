# The migrator runs before each deployment. Jobs are immutable, so scripts delete the previous Job, apply this one
# into the target namespace (kubectl apply -k ... -n <namespace>), and wait for it to complete. The default tag is the
# locally built image; CD and previews set theirs with `kustomize edit set image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: flagforge
    includeTemplates: true

resources:
  - job.yaml

images:
  - name: flagforge/migrator
    newName: flagforge/migrator
    newTag: local
