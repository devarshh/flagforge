# Applies EF Core migrations and seeds the admin (and the demo project when FF_SEED_DEMO_DATA is true), then exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: flagforge-migrator
  labels:
    app.kubernetes.io/name: migrator
    app.kubernetes.io/component: migrator
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrator
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: flagforge/migrator
          envFrom:
            - configMapRef:
                name: flagforge-config
          env:
            - name: ConnectionStrings__Sql
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: sql-connection-string
            - name: FF_SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: seed-admin-password
            - name: FF_SEED_DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: demo-user-password
            - name: FF_SEED_DEMO_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: demo-sdk-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
