# One namespace per pull request (ff-pr-<number>). The preview workflow sets the namespace, the image tags, and the
# hostname (pr-<number>.<gateway ip>.nip.io). In-cluster SQL Server, one replica, and small CPU requests so many
# previews fit on a small cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/ephemeral-sql

replicas:
  - name: management-api
    count: 1
  - name: evaluation-api
    count: 1
  - name: dashboard
    count: 1
  - name: demo
    count: 1

patches:
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: evaluation-api
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: evaluation-api
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
  - target:
      kind: StatefulSet
      name: sqlserver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
  # Previews are served over plain HTTP.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flagforge-config
      data:
        Auth__RefreshCookieSecure: "false"
