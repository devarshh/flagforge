# The worker: executes scheduled changes and cleans up old data. Its probes hit the pod directly, so it has no Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: flagforge/worker
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flagforge-config
          env:
            - name: ConnectionStrings__Sql
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: sql-connection-string
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Ready means SQL is reachable and no migrations are pending, so pods wait for the migrator Job.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; .NET needs a writable /tmp (diagnostics sockets, temporary files).
        - name: tmp
          emptyDir: {}
