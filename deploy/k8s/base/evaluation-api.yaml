# The evaluation API: SDK evaluation from in-memory snapshots, the SignalR hub, and usage counts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-api
  labels:
    app.kubernetes.io/name: evaluation-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-api
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: evaluation-api
      containers:
        - name: evaluation-api
          image: flagforge/evaluation-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flagforge-config
          env:
            - name: ConnectionStrings__Sql
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: sql-connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Ready means SQL is reachable and no migrations are pending, so pods wait for the migrator Job.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; .NET needs a writable /tmp (diagnostics sockets, temporary files).
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-api
  labels:
    app.kubernetes.io/name: evaluation-api
spec:
  selector:
    app.kubernetes.io/name: evaluation-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Scales on CPU: evaluation is CPU-bound once snapshots are cached. Every pod subscribes to Redis on its own, so
# SignalR needs no backplane and any number of replicas can serve streaming clients.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-api
  labels:
    app.kubernetes.io/name: evaluation-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: evaluation-api
  labels:
    app.kubernetes.io/name: evaluation-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-api
