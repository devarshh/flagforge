# The management API: the dashboard backend (auth, flags, targeting, audit, ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-api
  labels:
    app.kubernetes.io/name: management-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: management-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: management-api
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: management-api
      containers:
        - name: management-api
          image: flagforge/management-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flagforge-config
          env:
            - name: ConnectionStrings__Sql
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: sql-connection-string
            - name: Auth__JwtSigningKey
              valueFrom:
                secretKeyRef:
                  name: flagforge-secrets
                  key: jwt-signing-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Ready means SQL is reachable and no migrations are pending, so pods wait for the migrator Job.
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; .NET needs a writable /tmp (diagnostics sockets, temporary files).
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: management-api
  labels:
    app.kubernetes.io/name: management-api
spec:
  selector:
    app.kubernetes.io/name: management-api
  ports:
    - name: http
      port: 80
      targetPort: http
