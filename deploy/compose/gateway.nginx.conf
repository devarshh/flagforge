# The Compose gateway: one origin (http://localhost:8080) routed by path, with no rewriting.
#   /api/   management-api        /sdk/   evaluation-api (including the /sdk/hubs/ WebSockets)
#   /demo/  demo                  /       dashboard
# Health endpoints are not routed; containers and the smoke test reach them directly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    # The management API accepts up to 1 MB; the evaluation API enforces its own 32 KB limit.
    client_max_body_size 1m;

    # Resolve service names per request through Docker's DNS, so a restarted container's new address is picked up and
    # the gateway can start before the services it routes to.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $management_api http://management-api:8080;
    set $evaluation_api http://evaluation-api:8080;
    set $demo http://demo:8080;
    set $dashboard http://dashboard:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    location /api/ {
        proxy_pass $management_api;
    }

    # SignalR connections are long-lived WebSockets. This location sets its own headers, so it repeats the
    # forwarding headers (proxy_set_header in a location replaces the inherited ones).
    location /sdk/hubs/ {
        proxy_pass $evaluation_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /sdk/ {
        proxy_pass $evaluation_api;
    }

    location = /demo {
        return 301 /demo/;
    }

    location /demo/ {
        proxy_pass $demo;
    }

    location / {
        proxy_pass $dashboard;
    }
}
