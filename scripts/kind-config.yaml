# A one-node kind cluster for FlagForge (scripts/k8s-local-up.sh). The Envoy proxy's NodePort 30080 is published on
# the host as http://localhost:8090.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flagforge
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
