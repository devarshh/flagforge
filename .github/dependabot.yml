# Weekly dependency updates, with minor and patch updates grouped into one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /src/frontend
      - /tests/smoke
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/backend/FlagForge.ManagementApi
      - /src/backend/FlagForge.EvaluationApi
      - /src/backend/FlagForge.Worker
      - /src/backend/FlagForge.Migrator
      - /src/frontend/apps/dashboard
      - /src/frontend/apps/demo
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
