# Weekly dependency updates, with minor and patch updates grouped into one pull request per ecosystem. Major updates
# that conflict with deliberate version choices are ignored; PROGRESS.md explains each choice.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /src/frontend
      - /tests/smoke
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is outside the range typescript-eslint supports.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Follows the Node.js 24 LTS runtime in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The dashboard is built on React Router 7; moving to 8 is a migration, not a routine update.
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/backend/FlagForge.ManagementApi
      - /src/backend/FlagForge.EvaluationApi
      - /src/backend/FlagForge.Worker
      - /src/backend/FlagForge.Migrator
      - /src/frontend/apps/dashboard
      - /src/frontend/apps/demo
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The frontend images build with Node.js 24 LTS, like .nvmrc and CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
