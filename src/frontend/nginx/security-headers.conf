# Security headers for the dashboard and demo images (§11). Included at server level and again in every location
# that adds its own headers, because add_header in a location replaces the headers it would otherwise inherit.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
