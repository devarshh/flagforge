# The dashboard single-page app on port 8080 (nginx-unprivileged runs without root). The gateway sends every path
# that /api/, /sdk/, and /demo/ do not claim here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative redirects keep the gateway's host and port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built assets have content hashes in their names, so browsers may keep them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html names the current assets, so browsers must revalidate it.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes such as /projects/acme-coffee/flags all load the app.
    location / {
        try_files $uri /index.html;
    }
}
