name: flagforge

# Everything runs with no .env file: every setting has a development-only fallback (${VAR:-default}).
# `docker compose up --build -d`, then open http://localhost:8080 (dashboard) and http://localhost:8080/demo/.

x-sql-connection: &sql-connection "Server=sqlserver,1433;Database=flagforge;User Id=sa;Password=${MSSQL_SA_PASSWORD:-FlagForge_Dev_Sql_2026};TrustServerCertificate=True"

x-backend-dependencies: &backend-dependencies
  migrator:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server ships only for amd64; on Apple Silicon it runs under Rosetta emulation (enable it in Docker Desktop).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-FlagForge_Dev_Sql_2026}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    # Redis carries only pub/sub notifications, so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies migrations and seeds the admin and the demo project, then exits; the services start after it succeeds.
  migrator:
    build:
      context: .
      dockerfile: src/backend/FlagForge.Migrator/Dockerfile
    environment:
      ConnectionStrings__Sql: *sql-connection
      FF_SEED_ADMIN_EMAIL: ${FF_SEED_ADMIN_EMAIL:-admin@flagforge.local}
      FF_SEED_ADMIN_PASSWORD: ${FF_SEED_ADMIN_PASSWORD:-FlagForge!2026}
      FF_SEED_DEMO_DATA: ${FF_SEED_DEMO_DATA:-true}
      FF_SEED_DEMO_USER_PASSWORD: ${FF_SEED_DEMO_USER_PASSWORD:-FlagForge!2026}
      FF_SEED_DEMO_SDK_KEY: ${FF_SEED_DEMO_SDK_KEY:-ffk_local_demo_key_for_development_only_000}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  management-api:
    build:
      context: .
      dockerfile: src/backend/FlagForge.ManagementApi/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-local}
    environment:
      ConnectionStrings__Sql: *sql-connection
      Redis__ConnectionString: redis:6379
      Auth__JwtSigningKey: ${JWT_SIGNING_KEY:-dev-only-jwt-signing-key-replace-me-0123456789abcdef}
      # The gateway serves plain HTTP on localhost, so the refresh cookie cannot require HTTPS.
      Auth__RefreshCookieSecure: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: management-api
    depends_on: *backend-dependencies
    restart: unless-stopped

  evaluation-api:
    build:
      context: .
      dockerfile: src/backend/FlagForge.EvaluationApi/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-local}
    environment:
      ConnectionStrings__Sql: *sql-connection
      Redis__ConnectionString: redis:6379
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: evaluation-api
    depends_on: *backend-dependencies
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/backend/FlagForge.Worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-local}
    environment:
      ConnectionStrings__Sql: *sql-connection
      Redis__ConnectionString: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: worker
    depends_on: *backend-dependencies
    restart: unless-stopped

  dashboard:
    build:
      context: src/frontend
      dockerfile: apps/dashboard/Dockerfile
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 first, and nginx listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  demo:
    build:
      context: src/frontend
      dockerfile: apps/demo/Dockerfile
    environment:
      # Served to the store as /demo/config.json; defaults to the seeded development key.
      DEMO_SDK_KEY: ${DEMO_SDK_KEY:-${FF_SEED_DEMO_SDK_KEY:-ffk_local_demo_key_for_development_only_000}}
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 first, and nginx listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # One origin for the browser: /api/ and /sdk/ go to the APIs, /demo/ to the demo, everything else to the dashboard.
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine
    volumes:
      - ./deploy/compose/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      management-api:
        condition: service_started
      evaluation-api:
        condition: service_started
      dashboard:
        condition: service_healthy
      demo:
        condition: service_healthy
    restart: unless-stopped

  # Optional traces and metrics UI: OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 docker compose --profile observability up -d
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    profiles: [observability]
    environment:
      # Local use only: no sign-in for the UI or the OTLP endpoint.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"

volumes:
  sqlserver-data:
